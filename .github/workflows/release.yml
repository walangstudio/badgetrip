name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches every package version
        run: |
          v="${GITHUB_REF_NAME#v}"
          bad=$(pnpm -r --json ls --depth -1 | jq -r --arg v "$v" '.[] | select(.private != true and .version != $v) | "\(.name)@\(.version)"')
          if [ -n "$bad" ]; then echo "Tag $GITHUB_REF_NAME does not match: $bad"; exit 1; fi
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "CHANGELOG.md has no [$v] entry"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Publish to npm
        run: pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      - name: Create the GitHub release
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v h="## [$v]" 'index($0, h) == 1 {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
