name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Check the tag is on main and matches every package version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME is not on main"; exit 1; }
          v="${GITHUB_REF_NAME#v}"
          bad=$(pnpm -r --json ls --depth -1 | jq -r --arg v "$v" '.[] | select(.private != true and .version != $v) | "\(.name)@\(.version)"')
          if [ -n "$bad" ]; then echo "Tag $GITHUB_REF_NAME does not match: $bad"; exit 1; fi
          grep -qF "## [$v]" CHANGELOG.md || { echo "CHANGELOG.md has no [$v] entry"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Publish to npm
        # A prerelease (v1.0.0-rc.1) goes to the `next` dist-tag so it never becomes `latest`.
        run: |
          tag=latest
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac
          pnpm -r publish --access public --no-git-checks --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PNPM_CONFIG_PROVENANCE: 'true'
      - name: Create the GitHub release
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v h="## [$v]" 'index($0, h) == 1 {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag $pre
        env:
          GH_TOKEN: ${{ github.token }}
